<!doctype html>

<!-- An option page for the browser's native extension config page -->
<!-- The only option we need to save is the Suwayomi instance URL -->

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
  </head>

  <body>
    <form>
      <label for="suwayomi_url">Suwayomi instance url</label>
      <input type="text" id="suwayomi_url" name="suwayomi_url" />
      <button type="submit">Save</button>
    </form>
    <script src="options.js"></script>
  </body>
</html>
